[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inboxready"
version = "0.1.0"
description = "Check if a domain is ready for cold email: SPF, DKIM, DMARC, MX and blocklists, with plain-English fixes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "Ajay Roy" }]
keywords = ["email", "deliverability", "spf", "dkim", "dmarc", "cold-email", "dns", "outbound"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Topic :: Communications :: Email",
  "Topic :: Internet :: Name Service (DNS)",
]
dependencies = ["dnspython>=2.3"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
inboxready = "inboxready.cli:main"

[project.urls]
Homepage = "https://github.com/vishwadeep-succeed/inboxready"
Issues = "https://github.com/vishwadeep-succeed/inboxready/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/inboxready"]
