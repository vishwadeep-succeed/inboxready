[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inboxready"
dynamic = ["version"]
description = "Check every cold email sending domain in one command: SPF, DKIM, DMARC, provider setup, blocklists and domain age, with copy-paste DNS fixes and change alerts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Ajay Roy" }]
keywords = ["email", "deliverability", "spf", "dkim", "dmarc", "cold-email", "dns", "outbound", "instantly", "smartlead", "domain-monitoring"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Topic :: Communications :: Email",
  "Topic :: Internet :: Name Service (DNS)",
]
dependencies = ["dnspython>=2.3"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
inboxready = "inboxready.cli:main"

[project.urls]
Homepage = "https://github.com/vishwadeep-succeed/inboxready"
Issues = "https://github.com/vishwadeep-succeed/inboxready/issues"

[tool.hatch.version]
path = "src/inboxready/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/inboxready"]
