name: Validate on real domains
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/validate_real_domains.py"
      - ".github/workflows/validate.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e . checkdmarc
      - run: python scripts/validate_real_domains.py
